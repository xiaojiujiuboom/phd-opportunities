name: Refresh PhD opportunities

on:
  schedule:
    # UTC 00:23, 06:23, 12:23, 18:23 (Shanghai 08:23, 14:23, 20:23, 02:23).
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phd-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_KIND: phd
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r scraper/requirements.txt
      - name: Test eligibility and offline bundle
        working-directory: scraper
        run: python -m unittest test_eligibility test_sources
      - name: Collect PhD opportunities
        id: collect
        continue-on-error: true
        run: python scraper/fetch.py
      - name: Regenerate statistics and offline snapshot
        run: |
          python scraper/stats.py
          python scraper/bundle.py
      - name: Save generated data to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/stats.json data/offline-data.js data/collection-report.json
          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "chore: refresh PhD data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report failed collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Collection failed; previous job snapshot retained. See collection-report.json and logs."
          exit 1
